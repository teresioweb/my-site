<main>
  <h1>Logos 27</h1>

  <figure class="reveal-img side square color-band" style="--band-color:#CEDCE6;">
    <a href="pdf/NotizieOlivetti.pdf" target="_blank" rel="noopener">
      <img src="images/logos-pintori.jpg" alt="Logos Pintori">
    </a>
    <figcaption>
      <p class="intro-line">La Logos 27 in quattro articoli</p>
      <p><strong>> La &ldquo;Logos&rdquo; e il mercato delle calcolatrici.</strong> <em>Un articolo di Francesco Mascaro, del Centro Studi Olivetti.</em><br>
      <strong>> Il progetto della &ldquo;Logos&rdquo;.</strong> <em>Una nota di Teresio Gassino, che con un gruppo di collaboratori ha progettato questa macchina.</em><br>
      <strong>> Il design della &ldquo;Logos&rdquo;.</strong> <em>Un articolo dell&rsquo;architetto Ettore Sottsass jr., che ha realizzato la carrozzeria della nuova calcolatrice Olivetti.</em><br>
      <strong>> Dove si produce la &ldquo;Logos&rdquo;.</strong></p>
      <p class="fonte">Fonte: <em>Notizie Olivetti, n. 85, dicembre 1965</em>, Ufficio Stampa Olivetti, pp. 32&ndash;49.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FCC1C1;">
    <a href="pdf/Opuscolo1.pdf" target="_blank" rel="noopener">
      <img src="images/logos-opuscolo.jpg" alt="Logos Opuscolo">
    </a>
    <figcaption>
      <p><strong>Logos 27-2</strong>, opuscolo informativo (1967).<br>
      In traduzione olandese <a href="pdf/Opuscolo2.pdf" target="_blank" rel="noopener">qui</a> rintracciabile l&rsquo;opuscolo della Logos 27-1 (1966), con grafica di Giovanni Pintori. Una sequenza <a href="https://www.youtube.com/watch?v=lfbH4H8zvMU" target="_blank" rel="noopener">video</a> presentava la Logos insieme ad altri prodotti Olivetti.</p>
      <p class="fonte">Fonte: <a href="https://archive.org/details/olivettilogos272/" target="_blank" rel="noopener"><em>Olivetti Logos 27-2</em>: Internet Archive</a>, <a href="http://oa.letterformarchive.org/item?workID=lfa_pintori_0011" target="_blank" rel="noopener"><em>Olivetti Logos 27 by Pintori, Giovanni</em>: Letterform Archive</a> consultati nel novembre 2020.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side square color-band" style="--band-color:#FEE8B2;">
    <a href="http://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener">
      <img src="images/ranimer-belle-mecanique.jpg" alt="Ranimer une belle mecanique">
    </a>
    <figcaption>
      <p><strong>Philippe Bastide, &ldquo;Ranimer une belle m&eacute;canique&rdquo;.</strong><br>
      Straordinario lavoro di studio, ingegneria inversa e rimessa in funzione di una Logos 27 da parte di un ingegnere e grande appassionato di macchine da calcolo meccaniche. Al lavoro hanno contribuito le conoscenze di Alain Billerey, collezionista di macchine da calcolo (riconoscibile <a href="https://www.youtube.com/watch?v=8Ra22FApGu0" target="_blank" rel="noopener">qui</a> mentre mostra in funzione Logos, Divisumma e Tetractys della sua collezione).</p>
      <p class="fonte">Fonte: <a href="http://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener"><em>L&rsquo;oeil num&eacute;rique</em> (Internet Archive)</a> archiviato nel luglio 2019.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FFDDC2;">
    <a href="pdf/Logos.mp4" target="_blank" rel="noopener">
      <img src="images/schema-logos.jpg" alt="Schema Logos">
    </a>
    <figcaption>
      <p><strong>La Logos in funzione.</strong><br>
      L&rsquo;ingegnere e appassionato di macchine da calcolo meccaniche Emanuele Vanzetti mostra in funzione la Logos 27-1 della sua collezione.</p>
      <p class="fonte">Fonte: video gentile concessione dell&rsquo;ingegnere Emanuele Vanzetti, schema tratto dall&rsquo;opuscolo della Logos 27-2 (vedi sopra).</p>
    </figcaption>
  </figure>
