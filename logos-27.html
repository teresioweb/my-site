<main>
  <h1>Logos 27</h1>

  <figure class="reveal-img side square color-band" style="--band-color:#CEDCE6;">
    <a href="pdf/NotizieOlivetti.pdf" target="_blank" rel="noopener">
      <img src="images/logos-pintori.jpg" alt="Logos Pintori">
      <span class="img-badge">PDF</span>
    </a>
    <figcaption>
      <p>La Logos 27 in quattro articoli su <em>Notizie Olivetti</em>:<br>
      <strong>> La &ldquo;Logos&rdquo; e il mercato delle calcolatrici.</strong> Un articolo di Francesco Mascaro, del Centro Studi Olivetti.<br>
      <strong>> Il progetto della &ldquo;Logos&rdquo;.</strong> Una nota di Teresio Gassino, che con un gruppo di collaboratori ha progettato questa macchina.<br>
      <strong>> Il design della &ldquo;Logos&rdquo;.</strong> Un articolo dell&rsquo;architetto Ettore Sottsass jr., che ha realizzato la carrozzeria della nuova calcolatrice Olivetti.<br>
      <strong>> Dove si produce la &ldquo;Logos&rdquo;.</strong></p>
      <p class="fonte">Fonte: <em>Notizie Olivetti, n. 85, dicembre 1965</em>, Ufficio Stampa Olivetti, pp. 32&ndash;49.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FCC1C1;">
    <a href="pdf/Opuscolo1.pdf" target="_blank" rel="noopener">
      <img src="images/logos-opuscolo.jpg" alt="Logos Opuscolo">
      <span class="img-badge">PDF</span>
    </a>
    <figcaption>
      <p><strong>Olivetti Logos 27-2</strong>, opuscolo informativo (1967).<br>
      Un opuscolo con grafica di Giovanni Pintori (1966) presentava la versione precedente <em>27-1</em> della Logos (<a href="pdf/Opuscolo2.pdf" target="_blank" rel="noopener">link</a>, in lingua olandese). Una sequenza video presentava la Logos insieme ad altri prodotti Olivetti (<a href="https://www.youtube.com/watch?v=lfbH4H8zvMU" target="_blank" rel="noopener">link</a>).</p>
      <p class="fonte">Fonte: <a href="https://archive.org/details/olivettilogos272/" target="_blank" rel="noopener"><em>Olivetti Logos&nbsp27-2</em></a>, Internet Archive, <a href="http://oa.letterformarchive.org/item?workID=lfa_pintori_0011" target="_blank" rel="noopener"><em>Olivetti Logos&nbsp27</em></a>, Letterform Archive, consultati nel novembre 2020.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side square color-band" style="--band-color:#FEE8B2;">
    <a href="http://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener">
      <img src="images/ranimer-belle-mecanique.jpg" alt="Ranimer une belle mecanique">
      <span class="img-badge">&#8599; Link</span>
    </a>
    <figcaption>
      <p><strong>Ranimer une belle m&eacute;canique, la super-calculatrice Logos&nbsp27-2</strong>.<br>
      Straordinario lavoro di studio, ingegneria inversa e rimessa in funzione di una Logos 27-2 da parte dell&rsquo;ingegnere e appassionato di macchine da calcolo meccaniche Philippe Bastide. Al lavoro hanno contribuito le conoscenze di Alain Billerey, collezionista di macchine da calcolo (riconoscibile a questo <a href="https://www.youtube.com/watch?v=8Ra22FApGu0" target="_blank" rel="noopener">link</a> mentre mostra in funzione Logos, Divisumma e Tetractys della sua collezione).</p>
      <p class="fonte">Fonte: <a href="http://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener"><em>L&rsquo;oeil num&eacute;rique</em></a>, archiviato su Internet Archive nel luglio 2019.</p>
    </figcaption>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FFDDC2;">
    <a href="pdf/Logos.mp4" target="_blank" rel="noopener">
      <img src="images/schema-logos.jpg" alt="Schema Logos">
      <span class="img-badge">&#9654; Video</span>
    </a>
    <figcaption>
      <p><strong>La Logos in funzione.</strong><br>
      L&rsquo;ingegnere e appassionato di macchine da calcolo meccaniche Emanuele Vanzetti mostra in funzione la Logos 27-1 della sua collezione.</p>
      <p class="fonte">Fonte: video gentile concessione dell&rsquo;ingegnere Emanuele Vanzetti, schema tratto dall&rsquo;opuscolo della Logos&nbsp27-2 (vedi sopra).</p>
    </figcaption>
  </figure>
