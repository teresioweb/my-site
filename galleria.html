<main>
  <h1>Foto</h1>

  <p style="color:#999;">Teresio in foto storiche.</p>

  <!--
    Questa pagina su Wix usa una gallery widget caricata via JavaScript,
    quindi le immagini non sono state recuperabili automaticamente.
    Per popolarla:
    1. Vai sul sito Wix originale, apri la pagina Foto.
    2. Fai clic destro su ciascuna immagine → salva / scarica a piena risoluzione
       (oppure recuperale dal Wix Media Manager se hai accesso all'account).
    3. Metti i file scaricati in images/galleria/
    4. Duplica il blocco <figure> qui sotto per ogni foto.
  -->

  <div class="gallery-grid">
    <figure class="reveal-img from-right">
      <img src="images/galleria/foto-01.jpg" alt="Teresio con i colleghi" class="lightbox-trigger" data-caption="Teresio con i colleghi">
      <figcaption class="gallery-caption">Teresio con i colleghi</figcaption>
    </figure>
    <figure class="reveal-img from-right">
      <img src="images/galleria/foto-02.jpg" alt="Relax in montagna" class="lightbox-trigger" data-caption="Relax in montagna">
      <figcaption class="gallery-caption">Relax in montagna</figcaption>
    </figure>
    <figure class="reveal-img from-right">
      <img src="images/galleria/foto-03.jpg" alt="Passione infinita per la montagna" class="lightbox-trigger" data-caption="Passione infinita per la montagna">
      <figcaption class="gallery-caption">Passione infinita per la montagna</figcaption>
    </figure>
    <figure class="reveal-img">
      <img src="images/galleria/foto-04.jpg" alt="Brevetto di volo" class="lightbox-trigger" data-caption="Brevetto di volo">
      <figcaption class="gallery-caption">Brevetto di volo</figcaption>
    </figure>
    <figure class="reveal-img">
      <img src="images/galleria/foto-05.jpg" alt="La nomina a Cavaliere con il presidente Gronchi" class="lightbox-trigger" data-caption="La nomina a Cavaliere con il presidente Gronchi">
      <figcaption class="gallery-caption">La nomina a Cavaliere con il presidente Gronchi</figcaption>
    </figure>
    <figure class="reveal-img">
      <img src="images/galleria/foto-06.jpg" alt="Relax a Monte Navale con Capellaro" class="lightbox-trigger" data-caption="Relax a Monte Navale con Capellaro">
      <figcaption class="gallery-caption">Relax a Monte Navale con Capellaro</figcaption>
    </figure>
  </div>
</main>

<!-- Lightbox overlay: filled in by JS when a gallery image is clicked -->
<div class="lightbox-overlay">
  <button class="lightbox-close" aria-label="Chiudi">&times;</button>
  <button class="lightbox-prev" aria-label="Foto precedente">&#8249;</button>
  <button class="lightbox-next" aria-label="Foto successiva">&#8250;</button>
  <div class="lightbox-content">
    <img src="" alt="">
    <p class="lightbox-caption"></p>
  </div>
</div>
